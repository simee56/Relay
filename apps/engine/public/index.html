<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Relay voice test</title>
</head>
<body style="font-family: sans-serif; max-width: 600px; margin: 40px auto;">
  <h1>Relay voice test</h1>
  <button id="talk" style="font-size: 20px; padding: 16px 32px;">Hold to talk</button>
  <p id="status">Connecting...</p>
  <pre id="log"></pre>

  <script>
    const talkBtn = document.getElementById("talk");
    const statusEl = document.getElementById("status");
    const logEl = document.getElementById("log");
    const log = (line) => { logEl.textContent += line + "\n"; };

    const ws = new WebSocket(`ws://${location.host}/${location.search}`);
    ws.onopen = () => { statusEl.textContent = "Connected. Hold the button and speak."; };
    ws.onclose = () => { statusEl.textContent = "Disconnected."; };

    let releasedAt = 0;
    let activeTurn = null;
    let nextMeta = null;
    let firstAudioLogged = false;

    // ---- Audio queue ----
    const queue = [];
    let currentAudio = null;

    function playNext() {
      if (currentAudio || queue.length === 0) return;
      const url = queue.shift();
      currentAudio = new Audio(url);
      currentAudio.onerror = () => log("[debug] audio element error (browser could not decode the clip)");
      currentAudio.onended = () => {
        URL.revokeObjectURL(url);
        currentAudio = null;
        if (queue.length === 0) statusEl.textContent = "Ready.";
        playNext();
      };
      currentAudio.play().then(
        () => log("[debug] play() started"),
        (err) => log("[debug] play() FAILED: " + err.name + " - " + err.message)
      );
    }

    function stopPlayback() {
      queue.length = 0;
      if (currentAudio) {
        currentAudio.onended = null;
        currentAudio.pause();
        currentAudio = null;
      }
    }

    // ---- Messages from the server ----
    ws.onmessage = (event) => {
      if (typeof event.data === "string") {
        const msg = JSON.parse(event.data);
        log("[debug] got text message: " + msg.type);
        if (msg.type === "transcript") {
          activeTurn = msg.turn;
          log("You: " + msg.text);
        }
        if (msg.type === "audio") nextMeta = msg;
        if (msg.type === "reply") log("Relay: " + msg.text);
        if (msg.type === "error") {
          log("Error: " + msg.message);
          statusEl.textContent = "Ready.";
        }
        return;
      }

      const size = event.data.size ?? event.data.byteLength;
      log("[debug] got audio bytes: " + size);

      const meta = nextMeta;
      nextMeta = null;
      if (!meta || meta.turn !== activeTurn) {
        log("[debug] DROPPED clip. meta=" + JSON.stringify(meta) + " activeTurn=" + activeTurn);
        return;
      }

      if (!firstAudioLogged) {
        firstAudioLogged = true;
        log(`(first sound ${Date.now() - releasedAt} ms after you let go)`);
        statusEl.textContent = "Speaking...";
      }
      const url = URL.createObjectURL(new Blob([event.data], { type: "audio/wav" }));
      queue.push(url);
      playNext();
    };

    // ---- Microphone, push to talk ----
    let stream, recorder, chunks = [], holding = false;

    async function startTalking() {
      holding = true;

      stopPlayback();
      activeTurn = null;
      nextMeta = null;
      if (ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "interrupt" }));
      }

      if (!stream) {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      }
      if (!holding) return;

      chunks = [];
      recorder = new MediaRecorder(stream);
      recorder.ondataavailable = (e) => chunks.push(e.data);
      recorder.onstop = async () => {
        const blob = new Blob(chunks, { type: recorder.mimeType });
        if (blob.size < 1500) {
          statusEl.textContent = "Too short, try again.";
          return;
        }
        releasedAt = Date.now();
        firstAudioLogged = false;
        statusEl.textContent = "Thinking...";
        ws.send(await blob.arrayBuffer());

        setTimeout(() => {
          if (!firstAudioLogged && statusEl.textContent === "Thinking...") {
            log("[debug] 10 s passed and no audio clip was accepted");
          }
        }, 10000);
      };
      recorder.start();
      statusEl.textContent = "Listening...";
    }

    function stopTalking() {
      holding = false;
      if (recorder && recorder.state === "recording") recorder.stop();
    }

    talkBtn.addEventListener("pointerdown", startTalking);
    talkBtn.addEventListener("pointerup", stopTalking);
    talkBtn.addEventListener("pointerleave", stopTalking);
  </script>
</body>
</html>
